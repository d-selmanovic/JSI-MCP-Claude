[project]
name = "jsi-mcp-server"
version = "0.1.0"
description = "JSI CRM MCP server (read + audited write tools) – Streamable HTTP, WorkOS AuthKit"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3,<3",
    "pymysql>=1.1",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "uvicorn>=0.31",
    "starlette>=0.40",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "cryptography>=43"]

[project.scripts]
jsi-mcp-server = "jsi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
